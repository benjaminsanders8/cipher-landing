<div class="dscrim" id="dscrim" onclick="closeDemo()"></div>

  </div>

<script>
(function(){
  function openDemo(e){ e.preventDefault(); var t = e.currentTarget && e.currentTarget.getAttribute && e.currentTarget.getAttribute('data-dtitle'); document.querySelector('#dmodal .dhead span').textContent = t || 'BOOK A DEMO'; document.getElementById('dscrim').classList.add('open'); document.getElementById('dmodal').classList.add('open'); }
  window.closeDemo = function(){ document.getElementById('dscrim').classList.remove('open'); document.getElementById('dmodal').classList.remove('open'); };
  document.querySelectorAll('a[href="#demo"]').forEach(function(a){ a.addEventListener('click', openDemo); });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') closeDemo(); });
  var nb=document.querySelector('.nav-burger'), nl=document.getElementById('navLinks');
  if(nb&&nl){
    nb.addEventListener('click', function(){ var o=nl.classList.toggle('open'); nb.setAttribute('aria-expanded', o?'true':'false'); });
    nl.addEventListener('click', function(e){ var t=e.target.closest&&e.target.closest('a'); if(t){ nl.classList.remove('open'); nb.setAttribute('aria-expanded','false'); } });
  }
  document.getElementById('demoSend').addEventListener('click', function(e){
    e.preventDefault();
    var t = document.getElementById('demoMsg').value.trim();
    location.href = 'mailto:info@cipherhealthanalytics.com?subject=' + encodeURIComponent('Demo request — Cipher') + (t ? '&body=' + encodeURIComponent(t) : '');
  });
})();
</script>
<script>
(function(){
  /* Same-origin iframe integration:
     1) auto-size the frame to the demo's content (table toggle changes height)
     2) bridge the demo's "See AutoKey in action" button to the Book a Demo modal */
  var f = document.getElementById('demoFrame');
  if(!f) return;
  function size(){
    try{
      var d = f.contentDocument;
      // body.scrollHeight, NOT documentElement.scrollHeight: the latter is floored
      // at the frame's current viewport height, so the frame could grow but never
      // shrink back (e.g. after collapsing the table view).
      if(d && d.body) f.style.height = d.body.scrollHeight + 'px';
    }catch(e){}
  }
  function ready(){
    size();
    try{
      var b = f.contentDocument.querySelector('.cta-button');
      if(b){
        b.addEventListener('click', function(){
          document.querySelector('#dmodal .dhead span').textContent = 'BOOK A DEMO';
          document.getElementById('dscrim').classList.add('open');
          document.getElementById('dmodal').classList.add('open');
          // Move focus out of the frame and into the dialog so keyboard users
          // aren't stranded behind the modal.
          document.querySelector('#dmodal .dx').focus();
        });
      }
      // Escape must also work while focus is inside the frame — key events
      // don't cross the frame boundary to the parent document's handler.
      f.contentDocument.addEventListener('keydown', function(e){ if(e.key === 'Escape') closeDemo(); });
      new ResizeObserver(size).observe(f.contentDocument.body);
      // Backstop for the table toggle (the only height-changing interaction):
      // re-measure shortly after any click, in case ResizeObserver is unavailable.
      f.contentDocument.addEventListener('click', function(){ setTimeout(size, 60); setTimeout(size, 500); });
    }catch(e){ setInterval(size, 800); }
  }
  f.addEventListener('load', ready);
  try{ if(f.contentDocument && f.contentDocument.readyState === 'complete' && f.contentDocument.getElementById('incidence-chart')) ready(); }catch(e){}
})();
</script>
